limit_req_zone $binary_remote_addr zone=donut_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name browser.sanheqiyun.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://browser.sanheqiyun.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name browser.sanheqiyun.xyz;

    ssl_certificate /etc/letsencrypt/live/browser.sanheqiyun.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/browser.sanheqiyun.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DonutTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 256m;
    access_log /var/log/nginx/donut-browser-access.log;
    error_log /var/log/nginx/donut-browser-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/auth/login {
        limit_req zone=donut_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3930/auth/login;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3930/;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location /sync/ {
        proxy_pass http://127.0.0.1:3929/;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3930/admin/;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /downloads/latest.json {
        if (!-f /srv/sanhe-donut/releases/latest.json) { return 204; }
        alias /srv/sanhe-donut/releases/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /downloads/ {
        alias /srv/sanhe-donut/releases/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
    }

    location = /health {
        proxy_pass http://127.0.0.1:3930/health;
        access_log off;
    }

    location / { return 404; }
}
