services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: donut_control
      POSTGRES_USER: donut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donut -d donut_control"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  control-api:
    build: ../company-control
    restart: unless-stopped
    environment:
      PORT: "3930"
      DATABASE_URL: postgres://donut:${POSTGRES_PASSWORD}@postgres:5432/donut_control
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ISSUER: https://browser.sanheqiyun.xyz
      JWT_AUDIENCE: sanhe-browser
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SYNC_SERVER_URL: https://browser.sanheqiyun.xyz/sync
      BOOTSTRAP_SUPERADMIN_USERNAME: ${BOOTSTRAP_SUPERADMIN_USERNAME}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD}
      OFFLINE_AUTH_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3930:3930"
    networks: [internal]

  donut-sync:
    build:
      context: ..
      dockerfile: donut-sync/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3929"
      SYNC_JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      SYNC_JWT_ISSUER: https://browser.sanheqiyun.xyz
      SYNC_JWT_AUDIENCE: sanhe-browser
      BACKEND_INTERNAL_URL: http://control-api:3930
      BACKEND_INTERNAL_KEY: ${INTERNAL_API_KEY}
      S3_ENDPOINT: ${COS_S3_ENDPOINT}
      S3_REGION: ${COS_REGION}
      S3_ACCESS_KEY_ID: ${COS_SECRET_ID}
      S3_SECRET_ACCESS_KEY: ${COS_SECRET_KEY}
      S3_BUCKET: ${COS_BUCKET}
      S3_FORCE_PATH_STYLE: "false"
    depends_on:
      control-api:
        condition: service_started
    ports:
      - "127.0.0.1:3929:3929"
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
