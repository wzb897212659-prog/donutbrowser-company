server {
    listen 80;
    listen [::]:80;
    server_name browser.sanheqiyun.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "Donut Browser service is being provisioned.\n";
        add_header Content-Type text/plain;
    }
}
